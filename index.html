<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adad.Uz CRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.hide{display:none!important}
#loginPage{position:fixed;inset:0;background:linear-gradient(135deg,#0a0f1e,#1f1a0e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:1000}
.l-logo{font-size:52px;margin-bottom:8px}
.l-title{font-size:26px;font-weight:800;margin-bottom:4px}
.l-title span{color:#f59e0b}
.l-sub{font-size:13px;color:#64748b;margin-bottom:32px}
.l-box{background:#1e293b;border:1px solid #2d3f55;border-radius:16px;padding:24px;width:100%;max-width:360px}
.l-box h2{font-size:17px;margin-bottom:18px;text-align:center}
.linput,.finput,.fselect{width:100%;background:#0a0f1e;border:1px solid #2d3f55;border-radius:10px;padding:11px 13px;color:#e2e8f0;font-size:15px;outline:none;font-family:inherit}
.linput{margin-bottom:12px}
.linput:focus,.finput:focus,.fselect:focus{border-color:#f59e0b}
.lbtn{width:100%;background:#f59e0b;border:none;border-radius:10px;padding:13px;color:#111;font-size:15px;font-weight:800;cursor:pointer}
.lerr{color:#f87171;font-size:13px;text-align:center;margin-top:10px;min-height:20px}
.nav{background:#111827;border-bottom:1px solid #1e2d40;padding:0 14px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-title{font-size:15px;font-weight:800}
.nav-title span{color:#f59e0b}
.back-btn{background:#1e293b;border:1px solid #2d3f55;border-radius:8px;color:#e2e8f0;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600;display:none}
.nbtn{background:#1e293b;border:1px solid #2d3f55;border-radius:8px;color:#e2e8f0;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600}
.role-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.folder-home{flex:1;overflow-y:auto;padding:14px}
.folder-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:20px}
.folder-card{background:#1e293b;border:1px solid #2d3f55;border-radius:16px;padding:18px 14px 14px;cursor:pointer;position:relative;user-select:none}
.folder-card:active{transform:scale(.96)}
.folder-icon{font-size:32px;margin-bottom:8px;display:block}
.folder-name{font-size:13px;font-weight:700}
.folder-sub{font-size:11px;color:#64748b;margin-top:3px}
.badge{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;border-radius:20px;font-size:10px;font-weight:800;padding:1px 7px}
#app{flex:1;overflow-y:auto;padding:14px;min-height:0}
.page{display:none}.page.on{display:block}
.card{background:#1e293b;border:1px solid #2d3f55;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t1{font-weight:700;font-size:14px}
.t2{font-size:12px;color:#94a3b8;margin-top:2px}
.btn{border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit}
.btn-gold{background:#f59e0b;color:#111}
.btn-green{background:#16a34a}.btn-red{background:#dc2626}.btn-gray{background:#334155}.btn-blue{background:#2563eb}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.p-green{background:rgba(34,197,94,.15);color:#4ade80}.p-red{background:rgba(239,68,68,.15);color:#f87171}
.p-yellow{background:rgba(245,158,11,.15);color:#fbbf24}.p-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.h2{font-size:16px;font-weight:800;margin:4px 0 12px}
.empty{color:#64748b;text-align:center;padding:24px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#1e293b;border:1px solid #2d3f55;border-radius:14px;padding:12px}
.stat .v{font-size:19px;font-weight:800}
.stat .l{font-size:11px;color:#94a3b8;margin-top:2px}
.green{color:#4ade80}.red{color:#f87171}.gold{color:#fbbf24}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#111827;border:1px solid #2d3f55;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #1e2d40}
.mhead h2{font-size:16px}
.mbody{padding:14px 16px;overflow-y:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid #1e2d40}
.fgrow{margin-bottom:11px}
.flbl{font-size:12px;color:#94a3b8;margin-bottom:4px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.marr{background:#1e293b;border:1px solid #2d3f55;color:#e2e8f0;border-radius:8px;padding:6px 14px;cursor:pointer}
.mtitle{font-weight:800;min-width:130px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:20px;background:#1e293b;border:1px solid #2d3f55;font-size:12px;font-weight:700;cursor:pointer;color:#94a3b8}
.chip.on{background:#f59e0b;color:#111;border-color:#f59e0b}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:#f59e0b;border-radius:5px 5px 0 0;min-height:2px}
.bar small{font-size:10px;color:#94a3b8;margin-top:4px}
.bar b{font-size:10px;margin-bottom:2px}
.bubble{max-width:82%;padding:8px 11px;border-radius:12px;background:#1e293b;margin-bottom:8px;font-size:13px;word-break:break-word}
.bubble.me{background:#92400e;margin-left:auto}
.bubble small{display:block;font-size:10px;color:#94a3b8;margin-bottom:2px}
.bigcount{font-size:72px;font-weight:900;text-align:center;color:#fbbf24;line-height:1.1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;border:1px solid #f59e0b;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:2000}
.loader{text-align:center;padding:40px;color:#64748b}
</style>
</head>
<body>

<div id="loginPage">
  <div class="l-logo">⌚</div>
  <div class="l-title">Adad<span>.Uz</span></div>
  <div class="l-sub">CRM tizimi</div>
  <div class="l-box">
    <h2>Tizimga kirish</h2>
    <input class="linput" id="loginUser" placeholder="Login" autocomplete="off">
    <input class="linput" id="loginPass" type="password" placeholder="Parol">
    <button class="lbtn" onclick="doLogin()">Kirish →</button>
    <div class="lerr" id="loginErr"></div>
  </div>
</div>

<div id="mainWrap" class="hide" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden">
  <div class="nav">
    <div class="nav-left">
      <button class="back-btn" id="backBtn" onclick="goHome()">◀ Orqaga</button>
      <div class="nav-title" id="navTitle">⌚ Adad<span>.Uz</span> CRM</div>
    </div>
    <div class="nav-right"><button class="nbtn" onclick="doLogout()">Chiqish</button></div>
  </div>
  <div class="folder-home" id="folderHome"></div>
  <div id="app" style="display:none"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,doc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCLoUUxhKQ6eV27waMpPUgZlNTRRqmQiqU",
  authDomain:"future-academy-a9177.firebaseapp.com",
  projectId:"future-academy-a9177",
  storageBucket:"future-academy-a9177.firebasestorage.app",
  messagingSenderId:"455979338858",
  appId:"1:455979338858:web:b6a27e84dcf5247c774e13"
};
const db=getFirestore(initializeApp(firebaseConfig));

// ====== SOZLAMA: kirish ma'lumoti (o'zgartirish mumkin) ======
const ADMIN_LOGIN='Muhammad_max', ADMIN_PASS='max1999';

// ====== YORDAMCHI ======
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseInt(String(v||'').replace(/\D/g,''),10);return isNaN(n)?0:n;};
const fmt=n=>(Math.round(n)||0).toLocaleString('ru-RU').replace(/ /g,' ');
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const MN=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
let cY=new Date().getFullYear(),cM=new Date().getMonth();
const mkey=()=>cY+'-'+pad(cM+1);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toastRoot').appendChild(t);setTimeout(()=>t.remove(),2600);}
window.closeModal=()=>{$('modalRoot').innerHTML='';if(CU&&curTab)render();};
function modal(title,body,onSave,saveLabel){
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <div class="mhead"><h2>${title}</h2><button class="nbtn" onclick="closeModal()">✕</button></div>
    <div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn btn-gray" onclick="closeModal()">Bekor</button><button class="btn btn-gold" id="mSave">${saveLabel||'💾 Saqlash'}</button></div>
  </div></div>`;
  let busy=false;
  $('mSave').onclick=async()=>{if(busy)return;busy=true;try{const ok=await onSave();if(ok===false)busy=false;}catch(e){busy=false;toast('❗ '+e.message);}};
}
window.fmtInput=el=>{const n=num(el.value);el.value=n?fmt(n):'';};
const L=(id)=>`<div class="flbl">${id}</div>`;

// ====== MA'LUMOT ======
let watches=[],sales=[],leads=[],frozen=[],visits={},chat=[],tasks=[],expenses=[],tg={};
const COLS={w_watches:v=>watches=v,w_sales:v=>sales=v,w_leads:v=>leads=v,w_frozen:v=>frozen=v,w_chat:v=>chat=v,w_tasks:v=>tasks=v,w_expenses:v=>expenses=v};
let CU=null,curTab='',started=false;
function startListeners(){
  if(started)return;started=true;
  Object.keys(COLS).forEach(c=>{
    onSnapshot(collection(db,c),snap=>{
      const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));
      COLS[c](arr);refresh();
    },e=>toast('❗ '+c+': '+e.message));
  });
  onSnapshot(collection(db,'w_visits'),snap=>{visits={};snap.forEach(d=>visits[d.id]=(d.data().count||0));refresh();});
  onSnapshot(collection(db,'w_settings'),snap=>{snap.forEach(d=>{if(d.id==='tg')tg=d.data();});if(curTab==='tg')render();});
}
function refresh(){if(!CU)return;if(curTab==='')buildHome();else if(!$('modalRoot').innerHTML)render();}

// ====== LOGIN ======
window.doLogin=function(){
  const l=$('loginUser').value.trim(),p=$('loginPass').value.trim();
  if(l===ADMIN_LOGIN&&p===ADMIN_PASS){
    CU={name:'Admin'};
    $('loginPage').classList.add('hide');$('mainWrap').classList.remove('hide');
    startListeners();goHome();autoReportTimer();
  }else $('loginErr').textContent="Login yoki parol noto'g'ri!";
};
$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
window.doLogout=function(){CU=null;$('mainWrap').classList.add('hide');$('loginPage').classList.remove('hide');$('loginPass').value='';$('loginErr').textContent='';};

// ====== HOME ======
const FOLDERS=[
  {k:'katalog',i:'⌚',n:'Katalog',s:'Soatlar va zaxira'},
  {k:'chat',i:'💬',n:'Chat va vazifalar',s:'Muhokama va topshiriqlar'},
  {k:'tg',i:'📲',n:'Telegram',s:'Kunlik hisobot'},
  {k:'lid',i:'🎯',n:'Lidlar',s:'Potensial haridorlar'},
  {k:'yuz',i:'👁️',n:'Yuz tanish',s:'Kunlik haridorlar soni'},
  {k:'frozen',i:'🧊',n:'Muzlatilganlar',s:'Kutayotgan haridorlar'},
  {k:'dashboard',i:'📋',n:'Dashboard',s:'Umumiy ko\'rsatkichlar'},
  {k:'moliya',i:'💰',n:"Moliya bo'limi",s:'Sotuv va harajatlar'}
];
function buildHome(){
  const openLeads=leads.filter(l=>l.status==='yangi').length;
  const openTasks=tasks.filter(t=>!t.done).length;
  const low=watches.filter(w=>(w.qty||0)<=1).length;
  const badge={katalog:low,chat:openTasks,lid:openLeads};
  $('folderHome').innerHTML='<div class="folder-grid">'+FOLDERS.map(f=>`<div class="folder-card" onclick="gTab('${f.k}')">
    ${badge[f.k]?`<span class="badge">${badge[f.k]}</span>`:''}
    <span class="folder-icon">${f.i}</span><div class="folder-name">${f.n}</div><div class="folder-sub">${f.s}</div></div>`).join('')+'</div>';
}
window.goHome=function(){
  curTab='';$('modalRoot').innerHTML='';
  $('app').style.display='none';$('folderHome').style.display='block';
  $('backBtn').style.display='none';$('navTitle').innerHTML='⌚ Adad<span>.Uz</span> CRM';
  buildHome();
};
window.gTab=function(t){
  curTab=t;
  const f=FOLDERS.find(x=>x.k===t);
  $('folderHome').style.display='none';$('app').style.display='block';
  $('backBtn').style.display='block';$('navTitle').textContent=f.i+' '+f.n;
  render();
};
function render(){
  const fn={katalog:rKatalog,chat:rChat,tg:rTg,lid:rLid,yuz:rYuz,frozen:rFrozen,dashboard:rDash,moliya:rMoliya}[curTab];
  if(fn){fn();}
}
const setApp=h=>{const a=$('app'),y=a.scrollTop;a.innerHTML=h;a.scrollTop=y;};

// ====== KATALOG ======
let katQ='';
function rKatalog(){
  const q=katQ.toLowerCase();
  const list=watches.filter(w=>!q||((w.brand||'')+' '+(w.model||'')).toLowerCase().includes(q))
    .sort((a,b)=>((a.brand||'')+(a.model||'')).localeCompare((b.brand||'')+(b.model||'')));
  const total=watches.reduce((s,w)=>s+(w.qty||0),0);
  const val=watches.reduce((s,w)=>s+(w.qty||0)*(w.price||0),0);
  setApp(`<div class="stats"><div class="stat"><div class="v">${total} dona</div><div class="l">Jami zaxira (${watches.length} model)</div></div>
    <div class="stat"><div class="v gold">${fmt(val)}</div><div class="l">Zaxira qiymati (so'm)</div></div></div>
    <div class="row" style="margin-bottom:12px"><input class="finput grow" id="katQ" placeholder="🔍 Brend yoki model..." value="${esc(katQ)}"><button class="btn btn-gold" onclick="openWatch()">➕ Soat</button></div>`+
    (list.length?list.map(w=>{const q=w.qty||0;return `<div class="card"><div class="row">
      <div class="grow"><div class="t1">${esc(w.brand)} ${esc(w.model)}</div>
      <div class="t2">💵 ${fmt(w.price)} so'm${w.cost?` · tannarx ${fmt(w.cost)}`:''}</div>${w.note?`<div class="t2">${esc(w.note)}</div>`:''}</div>
      <span class="pill ${q===0?'p-red':q<=1?'p-yellow':'p-green'}">${q} dona</span></div>
      <div class="row" style="margin-top:10px;gap:6px">
        <button class="btn btn-green btn-sm" ${q?'':'disabled'} onclick="openSell('${w.id}')">🛒 Sotish</button>
        <button class="btn btn-blue btn-sm" onclick="addStock('${w.id}')">➕ Kirim</button>
        <button class="btn btn-gray btn-sm" onclick="openWatch('${w.id}')">✏️</button>
        <button class="btn btn-red btn-sm" onclick="delWatch('${w.id}')">🗑️</button></div></div>`;}).join(''):'<div class="empty">Hozircha soat yo\'q. "➕ Soat" tugmasi bilan qo\'shing.</div>'));
  const inp=$('katQ');if(inp)inp.oninput=e=>{katQ=e.target.value;rKatalog();const i=$('katQ');i.focus();i.setSelectionRange(katQ.length,katQ.length);};
}
window.openWatch=function(id){
  const w=watches.find(x=>x.id===id)||{};
  modal(id?'✏️ Soatni tahrirlash':'➕ Yangi soat',`
    <div class="f2"><div class="fgrow">${L('Brend *')}<input class="finput" id="w-brand" placeholder="Casio" value="${esc(w.brand)}"></div>
    <div class="fgrow">${L('Model *')}<input class="finput" id="w-model" placeholder="GA-2100" value="${esc(w.model)}"></div></div>
    <div class="f2"><div class="fgrow">${L("Sotuv narxi (so'm) *")}<input class="finput" id="w-price" inputmode="numeric" oninput="fmtInput(this)" value="${w.price?fmt(w.price):''}"></div>
    <div class="fgrow">${L("Tannarxi (so'm)")}<input class="finput" id="w-cost" inputmode="numeric" oninput="fmtInput(this)" value="${w.cost?fmt(w.cost):''}"></div></div>
    <div class="fgrow">${L('Miqdori (dona)')}<input class="finput" id="w-qty" inputmode="numeric" value="${w.qty||0}"></div>
    <div class="fgrow">${L('Izoh')}<input class="finput" id="w-note" placeholder="Rangi, kafolat..." value="${esc(w.note)}"></div>`,
  async()=>{
    const d={brand:$('w-brand').value.trim(),model:$('w-model').value.trim(),price:num($('w-price').value),cost:num($('w-cost').value),qty:num($('w-qty').value),note:$('w-note').value.trim()};
    if(!d.brand||!d.model||!d.price){toast('Brend, model va narxni kiriting');return false;}
    if(id)await updateDoc(doc(db,'w_watches',id),d);else await addDoc(collection(db,'w_watches'),d);
    closeModal();toast('✅ Saqlandi');
  });
};
window.delWatch=function(id){if(!confirm("Soat o'chirilsinmi?"))return;deleteDoc(doc(db,'w_watches',id));};
window.addStock=function(id){
  const w=watches.find(x=>x.id===id);
  modal('➕ Kirim: '+esc(w.brand+' '+w.model),`<div class="fgrow">${L('Nechta dona keldi?')}<input class="finput" id="st-q" inputmode="numeric" value="1"></div>`,
  async()=>{const n=num($('st-q').value);if(!n){toast('Sonni kiriting');return false;}
    await updateDoc(doc(db,'w_watches',id),{qty:(w.qty||0)+n});closeModal();toast('✅ Zaxira yangilandi');});
};
window.openSell=function(id){
  const w=watches.find(x=>x.id===id);
  modal('🛒 Sotish: '+esc(w.brand+' '+w.model),`
    <div class="f2"><div class="fgrow">${L('Soni')}<input class="finput" id="sl-q" inputmode="numeric" value="1"></div>
    <div class="fgrow">${L("Narxi (so'm, 1 dona)")}<input class="finput" id="sl-p" inputmode="numeric" oninput="fmtInput(this)" value="${fmt(w.price)}"></div></div>
    <div class="fgrow">${L('Haridor ismi')}<input class="finput" id="sl-n" placeholder="ixtiyoriy"></div>
    <div class="fgrow">${L('Telefon')}<input class="finput" id="sl-t" inputmode="tel" placeholder="ixtiyoriy"></div>`,
  async()=>{
    const q=num($('sl-q').value),p=num($('sl-p').value);
    if(!q||!p){toast('Son va narxni kiriting');return false;}
    if(q>(w.qty||0)){toast('Zaxirada faqat '+(w.qty||0)+' dona bor');return false;}
    await addDoc(collection(db,'w_sales'),{watchId:id,title:w.brand+' '+w.model,qty:q,price:p,cost:w.cost||0,buyer:$('sl-n').value.trim(),phone:$('sl-t').value.trim(),date:today(),ts:Date.now()});
    await updateDoc(doc(db,'w_watches',id),{qty:(w.qty||0)-q});
    closeModal();toast('✅ Sotildi');
  },'✅ Sotildi');
};

// ====== CHAT VA VAZIFALAR ======
let chatTab='chat';
function rChat(){
  const tabs=`<div class="chips"><span class="chip ${chatTab==='chat'?'on':''}" onclick="chatTab_('chat')">💬 Chat</span><span class="chip ${chatTab==='task'?'on':''}" onclick="chatTab_('task')">✅ Vazifalar (${tasks.filter(t=>!t.done).length})</span></div>`;
  if(chatTab==='chat'){
    const msgs=[...chat].sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-100);

const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
const rev=s=>(s.price||0)*(s.qty||0);
const prof=s=>((s.price||0)-(s.cost||0))*(s.qty||0);
function dayStats(d){
  const ss=sales.filter(s=>s.date===d);
  return {n:sum(ss,s=>s.qty||0),rev:sum(ss,rev),prof:sum(ss,prof),exp:sum(expenses.filter(e=>e.date===d),e=>e.amount||0),vis:visits[d]||0,list:ss};
}
function topModels(ss,n){
  const m={};ss.forEach(s=>{m[s.title]=(m[s.title]||0)+(s.qty||0);});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

  const s=dayStats(d);const mp=d.slice(0,7);
  const ms=sales.filter(x=>(x.date||'').startsWith(mp));
  const mR=sum(ms,rev),mP=sum(ms,prof),mE=sum(expenses.filter(e=>(e.date||'').startsWith(mp)),e=>e.amount||0);
  const low=watches.filter(w=>(w.qty||0)<=1);
  let t=`⌚ Adad.Uz — kunlik hisobot\n📅 ${d}\n\n`;
  t+=`🛒 Sotildi: ${s.n} dona\n💵 Tushum: ${fmt(s.rev)} so'm\n📈 Foyda: ${fmt(s.prof)} so'm\n💸 Harajat: ${fmt(s.exp)} so'm\n`;
  t+=`👁️ Kelgan haridor: ${s.vis} (konversiya ${s.vis?Math.round(s.n/s.vis*100):0}%)\n`;
  if(s.list.length)t+='\nSotuvlar:\n'+s.list.map(x=>`• ${x.title} × ${x.qty} — ${fmt(rev(x))}`).join('\n')+'\n';
  t+=`\n📆 Oy boshidan: tushum ${fmt(mR)}, sof foyda ${fmt(mP-mE)} so'm\n`;
  t+=`🎯 Yangi lidlar: ${leads.filter(l=>l.status==='yangi').length} · 🧊 Muzlatilgan: ${frozen.length}\n`;
  t+=`📦 Omborda: ${sum(watches,w=>w.qty||0)} dona\n`;
  if(low.length)t+='\n⚠️ Tugayapti:\n'+low.map(w=>`• ${w.brand} ${w.model} — ${w.qty||0} dona`).join('\n');
  return t;
}
async function sendReport(manual){
  if(!tg.token||!tg.chatId){if(manual)toast('Avval bot token va chat ID kiriting');return false;}
  try{
    const r=await fetch(`https://api.telegram.org/bot${tg.token}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:tg.chatId,text:buildReport(today())})});
    const j=await r.json();
    if(!j.ok){toast('❗ Telegram: '+(j.description||'xato'));return false;}
    await setDoc(doc(db,'w_settings','tg'),{...tg,lastSent:today()});
    toast('✅ Hisobot yuborildi');return true;
  }catch(e){toast('❗ '+e.message);return false;}
}
function autoReportTimer(){
  const check=()=>{
    if(!CU||!tg.auto||!tg.token||!tg.chatId)return;
    const h=new Date().getHours();
    if(h>=(tg.hour||21)&&tg.lastSent!==today()){tg.lastSent=today();sendReport(false);}
  };
  setTimeout(check,4000);setInterval(check,60000);
}
function rTg(){
  setApp(`<div class="card"><div class="t1">📲 Kunlik hisobot boti</div>
    <div class="t2" style="margin:6px 0 12px">Bitta Telegram botga CRM ma'lumotlari (sotuv, foyda, haridorlar, zaxira) yuboriladi.</div>
    <div class="fgrow">${L('Bot token (@BotFather dan)')}<input class="finput" id="tg-token" value="${esc(tg.token)}" placeholder="123456:ABC..."></div>
    <div class="fgrow">${L('Chat ID (hisobot keladigan joy)')}<input class="finput" id="tg-chat" value="${esc(tg.chatId)}" placeholder="123456789"></div>
    <label class="row" style="margin-bottom:10px;font-size:13px"><input type="checkbox" id="tg-auto" ${tg.auto?'checked':''}> Har kuni avtomatik yuborish (CRM ochiq bo'lsa)</label>
    <div class="fgrow">${L('Soat (0-23)')}<input class="finput" id="tg-hour" inputmode="numeric" value="${tg.hour||21}"></div>
    <div class="row" style="gap:8px"><button class="btn btn-gold grow" onclick="saveTg()">💾 Saqlash</button><button class="btn btn-green grow" onclick="sendReportNow()">📤 Hozir yuborish</button></div>
    ${tg.lastSent?`<div class="t2" style="margin-top:8px">Oxirgi yuborilgan: ${esc(tg.lastSent)}</div>`:''}</div>
    <div class="card"><div class="t1" style="margin-bottom:6px">Bugungi hisobot ko'rinishi</div><pre style="white-space:pre-wrap;font-size:12px;color:#cbd5e1;font-family:inherit">${esc(buildReport(today()))}</pre></div>
    <div class="card t2">💡 Chat ID olish: botga biror xabar yozing, so'ng brauzerda <b>api.telegram.org/bot&lt;TOKEN&gt;/getUpdates</b> ni oching — "chat":{"id": ...} raqami kerak. CRM yopiq bo'lsa ham har kuni yuborish uchun GitHub Actions faylidan foydalaning (alohida qo'llanma).</div>`);
}
window.saveTg=async function(){
  tg={...tg,token:$('tg-token').value.trim(),chatId:$('tg-chat').value.trim(),auto:$('tg-auto').checked,hour:Math.min(23,num($('tg-hour').value)||21)};
  await setDoc(doc(db,'w_settings','tg'),tg);toast('✅ Saqlandi');
};
window.sendReportNow=async function(){await window.saveTg();await sendReport(true);};
</script>
